<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 FIFA World Cup Predictions</title>
  <link rel="icon" type="image/x-icon" href="torist_logo_ 1.png">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f2622;
      background: #f7f9f8;
      accent-color: #1d8a6f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f9f8;
      color: #0f2622;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    header {
      display: grid;
      gap: 12px;
    }

    header h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: -0.04em;
      margin: 0;
    }

    header p {
      margin: 0;
      color: #476159;
      font-size: 1rem;
      line-height: 1.75;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .toolbar input {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border: 1px solid #d8e4df;
      border-radius: 14px;
      background: #ffffff;
      color: #0f2622;
      font-size: 0.98rem;
    }

    .toolbar button {
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      background: #1d8a6f;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.16s ease, filter 0.16s ease;
    }

    .toolbar button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .page-nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid #d8e4df;
      border-radius: 14px;
      background: white;
      color: #0f2622;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .tab:hover {
      transform: translateY(-1px);
    }

    .tab.active {
      background: #1d8a6f;
      color: white;
      border-color: #1d8a6f;
    }

    .hidden {
      display: none !important;
    }

    .bet-controls {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    .bet-controls input,
    .bet-controls select {
      width: 100%;
      border: 1px solid #d8e4df;
      border-radius: 12px;
      padding: 10px 12px;
      background: white;
      color: #0f2622;
      font-size: 0.95rem;
    }

    .bet-controls .bet-button {
      background: #1d8a6f;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 11px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .bet-controls .bet-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .bet-summary {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #eef7f1;
      border: 1px solid #d8e4df;
      color: #174834;
      font-size: 0.95rem;
    }

    .slopcoin-summary {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .balance-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 18px;
      border-radius: 20px;
      background: white;
      border: 1px solid #ddeae6;
    }

    .balance-panel p {
      margin: 0;
      color: #58786e;
      font-size: 0.95rem;
    }

    .balance-panel strong {
      font-size: 1.6rem;
      color: #153d32;
    }

    .slopcoin-note {
      color: #4f6c65;
      font-size: 0.95rem;
    }

    .bet-list {
      display: grid;
      gap: 12px;
    }

    .bet-card {
      padding: 16px;
      border-radius: 18px;
      background: white;
      border: 1px solid #ddeae6;
      box-shadow: 0 16px 32px rgba(17, 39, 35, 0.04);
    }

    .bet-card strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 6px;
      color: #153d32;
    }

    .bet-details {
      display: grid;
      gap: 6px;
      color: #4f6c65;
      font-size: 0.94rem;
    }

    .bet-details span {
      display: inline-flex;
      gap: 6px;
    }

    main {
      display: grid;
      gap: 16px;
    }

    .day-card {
      background: white;
      border-radius: 20px;
      border: 1px solid #e3ebe7;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(17, 39, 35, 0.05);
    }

    .day-card h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      color: #184f42;
    }

    .day-card .summary {
      margin: 0 0 18px;
      color: #56776a;
      font-size: 0.95rem;
    }

    .matches {
      display: grid;
      gap: 12px;
    }

    .match {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 14px;
      background: #f6faf8;
      border: 1px solid #ddeae6;
    }

    .match .teams {
      display: grid;
      gap: 6px;
    }

    .match .team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 1rem;
      font-weight: 700;
      color: #153d32;
    }

    .match .meta {
      display: grid;
      gap: 4px;
      color: #58786e;
      font-size: 0.95rem;
    }

    .match .meta span {
      display: inline-block;
    }

    .match .info {
      display: grid;
      gap: 6px;
      text-align: right;
    }

    .match .info strong {
      display: block;
      font-size: 0.95rem;
      color: #153d32;
    }

    .probabilities {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 10px 0 0;
      font-size: 0.92rem;
      color: #1d6048;
    }

    .probabilities span {
      background: #f1fbf7;
      border: 1px solid #d8eadf;
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
      font-weight: 600;
    }

    .match {
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .match:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 42px rgba(17, 39, 35, 0.07);
    }

    .match.expanded {
      background: #eef9f1;
    }

    .matrix-panel {
      display: none;
      grid-column: 1 / -1;
      padding-top: 16px;
      border-top: 1px solid #d8e4df;
      margin-top: 14px;
    }

    .match.expanded .matrix-panel {
      display: block;
    }

    .matrix-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .matrix-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #153d32;
    }

    .matrix-subtitle {
      color: #517168;
      font-size: 0.94rem;
    }

    .matrix-grid-wrapper {
      display: grid;
      gap: 16px;
    }

    .score-grid {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      background: white;
      border: 1px solid #d8e4df;
      border-radius: 16px;
      overflow: hidden;
    }

    .score-grid th,
    .score-grid td {
      border: 1px solid #e2ece7;
      padding: 10px 8px;
      min-width: 28px;
      font-size: 0.85rem;
      color: #0f352d;
      font-weight: 500;
    }

    .score-grid th {
      background: #f2faf6;
      font-weight: 700;
    }

    .cell.low {
      background: hsl(163, 80%, 95%);
    }

    .cell.medium {
      background: hsl(163, 60%, 85%);
    }

    .cell.high {
      background: hsl(163, 60%, 72%);
    }

    .matrix-legend {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid #ddeae6;
      border-radius: 16px;
      background: #f8fcf8;
      color: #324a42;
      font-size: 0.92rem;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-key {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .legend-key.low {
      background: hsl(163, 80%, 95%);
      border: 1px solid #daf3e7;
    }

    .legend-key.medium {
      background: hsl(163, 60%, 85%);
      border: 1px solid #c6e7d3;
    }

    .legend-key.high {
      background: hsl(163, 60%, 72%);
      border: 1px solid #a6d8bb;
    }

    .matrix-axis-labels {
      display: flex;
      justify-content: center;
      padding: 0 0 8px 0;
    }

    .axis-x-label {
      text-align: center;
      font-size: 0.95rem;
      color: #153d32;
      letter-spacing: 0.01em;
    }

    .axis-x-label strong {
      font-weight: 700;
    }

    .matrix-with-y-axis {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .matrix-axis-y-label {
      display: flex;
      align-items: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 0.95rem;
      color: #153d32;
      letter-spacing: 0.01em;
      white-space: nowrap;
      margin-top: 12px;
      word-spacing: 0.3em;
    }

    .matrix-axis-y-label strong {
      font-weight: 700;
      margin-right: 0.2em;
    }

    .score-grid th.axis-label {
      font-weight: 700;
      background: #f2faf6;
      color: #153d32;
    }

    .empty,
    .error {
      padding: 28px;
      border-radius: 20px;
      background: white;
      border: 1px solid #e3ebe7;
      color: #4f6c65;
      box-shadow: 0 16px 40px rgba(17, 39, 35, 0.05);
    }

    @media (max-width: 740px) {
      .toolbar { flex-direction: column; align-items: stretch; }
      .match { grid-template-columns: 1fr; text-align: left; }
      .match .info { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>2026 FIFA World Cup Predictions</h1>
        <p>Match by match predictions based on historical data and the Dixon-Coles model. Click each match to view goal probabilities.</p>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search by team, group, or date" />
        <button id="download">Download schedule</button>
      </div>
      <div class="page-nav">
        <button id="matchesTab" class="tab active" type="button">Matches</button>
        <button id="slopcoinTab" class="tab" type="button">Slopcoin</button>
      </div>
    </header>

    <main class="pages">
      <section id="matches-page" class="page-panel">
        <div id="schedule">
          <div class="empty">Loading schedule…</div>
        </div>
      </section>
      <section id="slopcoin-page" class="page-panel hidden">
        <div class="slopcoin-summary">
          <div class="balance-panel">
            <p>Your slopcoin balance</p>
            <strong id="slopBalance">1000</strong>
          </div>
          <div class="slopcoin-note">Place bets on matches and review your active bets here.</div>
        </div>
        <div id="betList" class="bet-list"></div>
      </section>
    </main>
  </div>

  <script>
    const scheduleEl = document.getElementById('schedule');
    const matchesTab = document.getElementById('matchesTab');
    const slopcoinTab = document.getElementById('slopcoinTab');
    const matchesPage = document.getElementById('matches-page');
    const slopcoinPage = document.getElementById('slopcoin-page');
    const slopBalanceEl = document.getElementById('slopBalance');
    const betListEl = document.getElementById('betList');
    const searchEl = document.getElementById('search');
    const downloadBtn = document.getElementById('download');
    let scheduleData = [];
    let predictionsMap = {};
    let slopBalance = 1000;
    let bets = {};

    const STORAGE_BALANCE = 'slopcoin_balance';
    const STORAGE_BETS = 'slopcoin_bets';

    function loadSlopData() {
      const storedBalance = localStorage.getItem(STORAGE_BALANCE);
      const storedBets = localStorage.getItem(STORAGE_BETS);

      if (storedBalance !== null && !Number.isNaN(Number(storedBalance))) {
        slopBalance = Number(storedBalance);
      }

      if (storedBets) {
        try {
          bets = JSON.parse(storedBets) || {};
        } catch {
          bets = {};
        }
      }
    }

    function saveSlopData() {
      localStorage.setItem(STORAGE_BALANCE, String(slopBalance));
      localStorage.setItem(STORAGE_BETS, JSON.stringify(bets));
    }

    function formatAmount(value) {
      return Math.round(value * 100) / 100;
    }

    function switchPage(page) {
      const isMatches = page === 'matches';
      matchesPage.classList.toggle('hidden', !isMatches);
      slopcoinPage.classList.toggle('hidden', isMatches);
      matchesTab.classList.toggle('active', isMatches);
      slopcoinTab.classList.toggle('active', !isMatches);
      searchEl.parentElement.style.display = isMatches ? 'flex' : 'none';
      downloadBtn.style.display = isMatches ? 'inline-flex' : 'none';
      if (!isMatches) {
        renderSlopcoinPage();
      }
    }

    function setSlopBalance(value) {
      slopBalance = value;
      slopBalanceEl.textContent = formatAmount(slopBalance);
      saveSlopData();
    }

    function createBetId(game) {
      return game.id || `${game.home_team_name_en || game.home_team}|${game.away_team_name_en || game.away_team}|${game.local_date || game.date}`;
    }

    function getProbabilityLabel(choice, home, away) {
      if (choice === 'home') return home;
      if (choice === 'away') return away;
      return 'draw';
    }

    function calculatePayout(amount, choice, probabilities) {
      if (choice === 'home') {
        return amount * (1 + (probabilities.away_win || 0));
      }
      if (choice === 'away') {
        return amount * (1 + (probabilities.home_win || 0));
      }
      return amount * (1 + (probabilities.draw || 0));
    }

    function renderSlopcoinPage() {
      slopBalanceEl.textContent = formatAmount(slopBalance);
      const betEntries = Object.values(bets);
      if (betEntries.length === 0) {
        betListEl.innerHTML = '<div class="empty">No bets placed yet.</div>';
        return;
      }

      betListEl.innerHTML = betEntries.map(bet => `
        <div class="bet-card">
          <strong>${bet.home_team} vs ${bet.away_team}</strong>
          <div class="bet-details">
            <span><strong>Amount:</strong> ${formatAmount(bet.amount)} slopcoins</span>
            <span><strong>Bet:</strong> ${getProbabilityLabel(bet.choice, bet.home_team, bet.away_team)}</span>
            <span><strong>Potential return:</strong> ${formatAmount(bet.potentialPayout)} slopcoins</span>
            <span><strong>Placed:</strong> ${new Date(bet.placedAt).toLocaleString()}</span>
          </div>
        </div>
      `).join('');
    }

    function handlePlaceBet(button) {
      const amountEl = button.closest('.bet-controls').querySelector('.bet-amount');
      const choiceEl = button.closest('.bet-controls').querySelector('.bet-choice');
      const amount = Number(amountEl.value);
      const choice = choiceEl.value;
      const home = button.dataset.home;
      const away = button.dataset.away;
      const gameId = button.dataset.gameId;
      const scoreKey = button.dataset.scoreKey;
      const prediction = getPredictions(home, away);

      if (!prediction) {
        alert('Prediction not available for this match.');
        return;
      }
      if (!amount || amount <= 0) {
        alert('Enter a valid slopcoin amount.');
        return;
      }
      if (amount > slopBalance) {
        alert('Not enough slopcoins to place that bet.');
        return;
      }

      const payout = calculatePayout(amount, choice, prediction.probabilities);
      const betId = scoreKey || gameId || `${home}|${away}|${prediction.local_date || ''}`;
      bets[betId] = {
        id: betId,
        home_team: home,
        away_team: away,
        amount,
        choice,
        probabilities: prediction.probabilities,
        potentialPayout: payout,
        placedAt: new Date().toISOString()
      };

      setSlopBalance(slopBalance - amount);
      saveSlopData();
      renderSchedule(scheduleData);
    }

    function attachBetHandlers() {
      document.querySelectorAll('.bet-button').forEach(button => {
        button.addEventListener('click', () => handlePlaceBet(button));
      });
    }

    function getPredictionForDisplay(game) {
      const home = game.home_team_name_en || game.home_team || 'Home';
      const away = game.away_team_name_en || game.away_team || 'Away';
      return getPredictions(home, away);
    }

    function renderBetSection(game, probability, betId) {
      const bet = bets[betId];
      if (bet) {
        return `<div class="bet-summary">Bet placed: ${formatAmount(bet.amount)} slopcoins on ${getProbabilityLabel(bet.choice, bet.home_team, bet.away_team)}. Potential return ${formatAmount(bet.potentialPayout)} slopcoins.</div>`;
      }
      return `
        <div class="bet-controls">
          <input class="bet-amount" type="number" min="1" placeholder="Amount" />
          <select class="bet-choice">
            <option value="home">${game.home_team_name_en || game.home_team}</option>
            <option value="draw">Draw</option>
            <option value="away">${game.away_team_name_en || game.away_team}</option>
          </select>
          <button class="bet-button" type="button" data-home="${game.home_team_name_en || game.home_team}" data-away="${game.away_team_name_en || game.away_team}" data-game-id="${game.id || ''}" data-score-key="${betId}">Place bet</button>
        </div>
      `;
    }

    function renderSchedule(items) {
      if (!items || items.length === 0) {
        scheduleEl.innerHTML = '<div class="empty">No matches found.</div>';
        return;
      }

      const groups = groupByDate(items);
      scheduleEl.innerHTML = groups.map(group => {
        const matches = group.games.map(game => {
          const home = game.home_team_name_en || game.home_team || 'Home';
          const away = game.away_team_name_en || game.away_team || 'Away';
          const dateDisplay = formatDay(game.local_date || game.date || '');
          const timeDisplay = (game.local_date || game.date || '').split(' ')[1] || '';
          const label = game.group ? `${game.group.toUpperCase()} • ${game.type || 'group'}` : game.type || '';
          const probability = getPlaceholderProbabilities(game);
          const betId = createBetId(game);
          const prediction = getPredictionForDisplay(game);
          const matrix = prediction ? prediction.matrix : null;

          return `
            <div class="match" role="button" tabindex="0" aria-expanded="false">
              <div class="teams">
                <div class="team">${home}</div>
                <div class="team">${away}</div>
              </div>
              <div class="info">
                <strong>${timeDisplay || 'TBD'}</strong>
                <div class="probabilities">
                  <span>Home win ${probability.homeWin}%</span>
                  <span>Draw ${probability.draw}%</span>
                  <span>Away win ${probability.awayWin}%</span>
                </div>
                <div class="meta"><span>${label}</span></div>
                ${renderBetSection(game, probability, betId)}
              </div>
              ${renderScoreMatrix(home, away, matrix)}
            </div>
          `;
        }).join('');

        return `
          <section class="day-card">
            <h2>${formatDay(group.date)}</h2>
            <p class="summary">${group.games.length} match${group.games.length === 1 ? '' : 'es'} scheduled</p>
            <div class="matches">${matches}</div>
          </section>
        `;
      }).join('');

      scheduleEl.querySelectorAll('.match').forEach(matchEl => {
        matchEl.addEventListener('click', event => {
          if (event.target.closest('.bet-controls')) return;
          const isExpanded = matchEl.classList.toggle('expanded');
          matchEl.setAttribute('aria-expanded', isExpanded);
        });

        matchEl.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            const isExpanded = matchEl.classList.toggle('expanded');
            matchEl.setAttribute('aria-expanded', isExpanded);
          }
        });
      });

      attachBetHandlers();
    }

    function parseLocalDate(value) {
      const [datePart, timePart] = value.split(' ');
      if (!datePart) return null;
      const [month, day, year] = datePart.split('/').map(Number);
      const [hour = 0, minute = 0] = (timePart || '').split(':').map(Number);
      return new Date(year, month - 1, day, hour, minute);
    }

    function formatDay(value) {
      const date = parseLocalDate(value);
      if (!date || Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    }

    function groupByDate(items) {
      const grouped = items.reduce((acc, item) => {
        const raw = item.local_date || item.date || '';
        const dateKey = raw.split(' ')[0] || 'Unknown';
        if (!acc[dateKey]) acc[dateKey] = [];
        acc[dateKey].push(item);
        return acc;
      }, {});
      return Object.keys(grouped).sort((a, b) => parseLocalDate(a + ' 00:00') - parseLocalDate(b + ' 00:00')).map(date => ({ date, games: grouped[date] }));
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function getPredictions(home, away) {
      const key = `${home}|${away}`;
      return predictionsMap[key] || null;
    }

    function getPlaceholderProbabilities(game) {
      const home = game.home_team_name_en || game.home_team || 'Home';
      const away = game.away_team_name_en || game.away_team || 'Away';
      const prediction = getPredictions(home, away);
      if (prediction) {
        return {
          homeWin: Math.round(prediction.probabilities.home_win * 100),
          draw: Math.round(prediction.probabilities.draw * 100),
          awayWin: Math.round(prediction.probabilities.away_win * 100)
        };
      }
      const homeLen = home.length;
      const awayLen = away.length;
      const seed = (homeLen - awayLen) * 0.02 + (((home.charCodeAt(0) || 65) - (away.charCodeAt(0) || 65)) / 200);
      let homeWin = clamp(0.32 + seed, 0.18, 0.55);
      let awayWin = clamp(0.32 - seed, 0.18, 0.55);
      let draw = 1 - homeWin - awayWin;
      if (draw < 0.08) {
        const reduce = (0.08 - draw) / 2;
        homeWin = clamp(homeWin - reduce, 0.18, 0.7);
        awayWin = clamp(awayWin - reduce, 0.18, 0.7);
        draw = 1 - homeWin - awayWin;
      }
      const values = [Math.round(homeWin * 100), Math.round(draw * 100), Math.round(awayWin * 100)];
      const diff = 100 - values.reduce((sum, value) => sum + value, 0);
      values[0] += diff;
      return { homeWin: values[0], draw: values[1], awayWin: values[2] };
    }

    function matrixCellClass(homeGoals, awayGoals) {
      if (homeGoals === awayGoals) return 'low';
      const gap = Math.abs(homeGoals - awayGoals);
      if (gap >= 4 || (homeGoals === 5 && awayGoals === 0) || (homeGoals === 0 && awayGoals === 5)) {
        return 'high';
      }
      return gap >= 2 ? 'medium' : 'low';
    }

    function renderScoreMatrix(home, away, matrix = null) {
      const headerCells = Array.from({ length: 6 }, (_, value) => `<th>${value}</th>`).join('');
      const rows = Array.from({ length: 6 }, (_, homeGoals) => {
        const cells = Array.from({ length: 6 }, (_, awayGoals) => {
          const cellClass = matrixCellClass(homeGoals, awayGoals);
          const value = matrix ? matrix[homeGoals][awayGoals] : null;
          const cellContent = value !== null ? `${(value * 100).toFixed(1)}%` : '';
          return `<td class="cell ${cellClass}" aria-label="${homeGoals}-${awayGoals} score probability">${cellContent}</td>`;
        }).join('');
        return `<tr><th class="axis-label">${homeGoals}</th>${cells}</tr>`;
      }).join('');

      return `
        <div class="matrix-panel">
          <div class="matrix-header">
            <div>
              <div class="matrix-title">Goal Probability Matrix</div>
              <div class="matrix-subtitle">${home} vs ${away}</div>
            </div>
          </div>

          <div class="matrix-grid-wrapper">
            <div class="matrix-axis-labels">
              <div class="axis-x-label">
                <strong>${away}</strong> goals (away)
              </div>
            </div>
            <div class="matrix-with-y-axis">
              <div class="matrix-axis-y-label">
                <strong>${home}</strong> goals (home)
              </div>
              <table class="score-grid">
                <thead>
                  <tr>
                    <th></th>
                    ${headerCells}
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>

            <div class="matrix-legend">
              <strong>Heat map key</strong>
              <div class="legend-row"><span class="legend-key low"></span><span>Tie cells</span></div>
              <div class="legend-row"><span class="legend-key medium"></span><span>Moderate spread</span></div>
              <div class="legend-row"><span class="legend-key high"></span><span>Large spread</span></div>
            </div>
          </div>
        </div>
      `;
    }

    async function loadSchedule() {
      try {
        const scheduleResponse = await fetch('world_cup_104_schedule.json');
        if (!scheduleResponse.ok) throw new Error('Unable to load schedule JSON');
        const scheduleJsonData = await scheduleResponse.json();
        scheduleData = Array.isArray(scheduleJsonData.games) ? scheduleJsonData.games : (Array.isArray(scheduleJsonData) ? scheduleJsonData : []);

        const predictionsResponse = await fetch('world_cup_match_predictions.json');
        if (predictionsResponse.ok) {
          const predictions = await predictionsResponse.json();
          predictions.forEach(pred => {
            const key = `${pred.home_team}|${pred.away_team}`;
            predictionsMap[key] = pred;
          });
        }

        loadSlopData();
        renderSchedule(scheduleData);
        switchPage('matches');

        downloadBtn.addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(scheduleJsonData, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'world_cup_104_schedule.json';
          link.click();
          URL.revokeObjectURL(url);
        });
      } catch (error) {
        scheduleEl.innerHTML = `<div class="error">Could not load schedule: ${error.message}</div>`;
      }
    }

    searchEl.addEventListener('input', event => {
      const query = event.target.value.trim().toLowerCase();
      if (!query) {
        renderSchedule(scheduleData);
        return;
      }
      const filtered = scheduleData.filter(game => {
        const home = (game.home_team_name_en || game.home_team || '').toLowerCase();
        const away = (game.away_team_name_en || game.away_team || '').toLowerCase();
        const group = (game.group || game.type || '').toLowerCase();
        const date = (game.local_date || game.date || '').toLowerCase();
        return home.includes(query) || away.includes(query) || group.includes(query) || date.includes(query);
      });
      renderSchedule(filtered);
    });

    matchesTab.addEventListener('click', () => switchPage('matches'));
    slopcoinTab.addEventListener('click', () => switchPage('slopcoin'));

    loadSchedule();
  </script>
</body>
</html>
